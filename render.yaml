services:
  # =========================
  # BACKEND - FastAPI
  # =========================
  - type: web
    name: evosearch-backend
    runtime: python
    plan: starter
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: APP_NAME
        value: EVOSearch

      - key: ENV
        value: production

      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/data/evosearch.db

      - key: STORAGE_PATH
        value: /opt/render/project/src/data/uploads

      - key: VECTOR_INDEX_PATH
        value: /opt/render/project/src/data/vector_index

      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2

      - key: EMBEDDING_DIM
        value: "384"

      - key: MAX_UPLOAD_MB
        value: "25"

      - key: SECRET_KEY
        generateValue: true

      # Optional Groq AI
      - key: GROQ_API_KEY
        sync: false

      - key: LLM_PROVIDER
        value: groq

      - key: LLM_MODEL
        value: llama-3.1-70b-versatile

      # Backend public URL, automatically supplied by Render
      - key: PUBLIC_API_URL
        fromService:
          name: evosearch-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

    disk:
      name: evosearch-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10


  # =========================
  # FRONTEND - React/Vite
  # =========================
  - type: web
    name: evosearch-frontend
    runtime: static

    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        fromService:
          name: evosearch-backend
          type: web
          envVarKey: PUBLIC_API_URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html