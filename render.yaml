services:
  # ==========================================
  # EVOSearch Backend - FastAPI
  # FREE
  # ==========================================
  - type: web
    name: evosearch-backend
    runtime: docker
    plan: free

    rootDir: backend

    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render uses port 10000 for web services.
    # This overrides the Dockerfile's port 8000.
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000

    healthCheckPath: /api/health

    envVars:
      - key: APP_NAME
        value: EVOSearch

      - key: ENV
        value: production

      # FREE deployment: data is temporary.
      - key: DATABASE_URL
        value: sqlite:///./data/evosearch.db

      - key: STORAGE_PATH
        value: ./data/uploads

      - key: VECTOR_INDEX_PATH
        value: ./data/vector_index

      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2

      - key: EMBEDDING_DIM
        value: "384"

      - key: MAX_UPLOAD_MB
        value: "25"

      # Render generates this automatically.
      - key: SECRET_KEY
        generateValue: true

      # Leave these blank for now.
      # EVOSearch will use its heuristic/fallback mode.
      - key: GROQ_API_KEY
        value: ""

      - key: LLM_PROVIDER
        value: ""

      - key: LLM_MODEL
        value: llama-3.1-70b-versatile

      # Public backend URL automatically supplied by Render.
      - key: PUBLIC_API_URL
        fromService:
          name: evosearch-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL


  # ==========================================
  # EVOSearch Frontend - React + Vite
  # FREE
  # ==========================================
  - type: web
    name: evosearch-frontend
    runtime: static

    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    envVars:
      # Automatically becomes something like:
      # https://evosearch-backend.onrender.com
      - key: VITE_API_URL
        fromService:
          name: evosearch-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      # React Router support
      - type: rewrite
        source: /*
        destination: /index.html